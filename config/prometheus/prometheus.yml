# ==============================================================================
# Prometheus Scrape Configuration for LLM Serving & Hardware Monitoring
# ==============================================================================

global:
  scrape_interval: 5s # Thu thập metrics mỗi 5 giây để bắt kịp biến thiên latency
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. vLLM Engine Metrics (Tokens/s, TTFT, KV Cache usage, Queue size)
  # ----------------------------------------------------------------------------
  - job_name: 'vllm'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['vllm-engine:8000']
        labels:
          engine: 'vllm'
          tier: 'inference-serving'

  # ----------------------------------------------------------------------------
  # 2. LiteLLM Proxy Metrics (Request latency, Model usage, Error rate)
  # ----------------------------------------------------------------------------
  - job_name: 'litellm'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['litellm-gateway:4000']
        labels:
          service: 'gateway'
          tier: 'api-routing'

  # ----------------------------------------------------------------------------
  # 3. NVIDIA DCGM Exporter (GPU VRAM, SM Clock, Power, Temp)
  # ----------------------------------------------------------------------------
  - job_name: 'dcgm-exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels:
          hardware: 'nvidia-gpu'
          tier: 'hardware-telemetry'

  # ----------------------------------------------------------------------------
  # 4. cAdvisor (Container Resource Usage: CPU, Memory, Network I/O)
  # ----------------------------------------------------------------------------
  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          infra: 'docker-containers'
          tier: 'system-resources'
